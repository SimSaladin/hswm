cradle:
  cabal:
    - path: "haskell-wayland-core/src"
      component: "lib:haskell-wayland-core"

    - path: "haskell-wayland-core/tests"
      component: "haskell-wayland-core:test:spec"

    - path: "hs-bindgen-hooks/src"
      component: "lib:hs-bindgen-hooks"

    - path: "hswm/src"
      component: "lib:hswm"

    - path: "hswm/ipc-api"
      component: "hswm:lib:ipc-api"

    - path: "hswm/hswm-prelude"
      component: "hswm:lib:prelude"

    - path: "hswm/app/Main.hs"
      component: "hswm:exe:hswm"

    - path: "hswm/app-ctl/Main.hs"
      component: "hswm:exe:hswmctl"

    - path: "hswm-bindings/src"
      component: "lib:hswm-bindings"

    - path: "hswm-bindings/tests"
      component: "hswm-bindings:test:tests"

    - path: "pixman-bindings/src"
      component: "lib:pixman-bindings"

    - path: "pixman-bindings/test"
      component: "pixman-bindings:test:pixman-test"

    - path: "waybar-cffi-hs/src"
      component: "lib:waybar-cffi-hs"

    - path: "waybar-cffi-hs/plugin"
      component: "waybar-cffi-hs:flib:waybarhaskellplugin"

    - path: "xkbcommon-bindings/src"
      component: "lib:xkbcommon-bindings"

    - path: "xkbcommon-bindings/tests"
      component: "xkbcommon-bindings:test:xkbcommon-spec"
