cradle:
  cabal:
    - path: "hs-bindgen-hooks/src"
      component: "lib:hs-bindgen-hooks"

    - path: "xkbcommon-bindings/src"
      component: "lib:xkbcommon-bindings"

    - path: "pixman-bindings/src"
      component: "lib:pixman-bindings"

    - path: "hswm/src"
      component: "lib:hswm"

    - path: "hswm/hswm-prelude"
      component: "hswm:lib:prelude"

    - path: "hswm/ipc-api"
      component: "hswm:lib:ipc-api"

    - path: "hswm/app/Main.hs"
      component: "hswm:exe:hswm"

    - path: "hswm/app-ctl/Main.hs"
      component: "hswm:exe:hswmctl"

    - path: "hswm-bindings/src"
      component: "lib:hswm-bindings"

    - path: "waybar-cffi-hs/lib"
      component: "lib:waybar-cffi-hs"

    - path: "waybar-cffi-hs/lib"
      component: "waybar-cffi-hs:lib:waybarhaskellplugin"
