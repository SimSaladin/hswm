---
verbatim:
  - cabal-version:    3.12
name:               hswm
version: &version   0.1.0.0
synopsis:           Wayland window manager for River
description:        Wayland window manager for River
license:            MIT
license-file:       LICENSE
author:             Samuli Thomasson
maintainer:         samuli.thomasson@pm.me
# copyright:
build-type:         Simple
tested-with:
  - GHC == 9.14.1
  - GHC == 9.12.4
  - GHC == 9.12.2

flags:
  use-llvm:
    description: Link with LLVM
    default: true
    manual: true

language: GHC2024
default-extensions:
  - DeriveAnyClass
  - DerivingVia
  - DuplicateRecordFields
  - FunctionalDependencies
  - OverloadedLabels
  - OverloadedRecordDot
  - OverloadedStrings
  - PackageImports
  - QuantifiedConstraints
  - RecordWildCards
  - TypeFamilies

# https://discourse.haskell.org/t/what-are-you-supposed-to-do-about-wambiguous-fields/9545/36?page=2
ghc-options:
  -Wall
  -Wunused-packages
  -Wno-partial-type-signatures
  -Wno-ambiguous-fields

when:
  - condition: flag(use-llvm) && impl(ghc >= 9.14.1)
    ghc-options: -fllvm

__:
  # Deps
  - &base
    name: base
    version: '>=4.21 && <5'

  - &base-noprelude
    <<: *base
    mixin: hiding (Prelude)

  - &hswm-prelude
    name: hswm:prelude
    mixin: (HSWM.Prelude as Prelude)

  - &dep-template-haskell            template-haskell             >=2.20     && <3
  - &dep-JuicyPixels                 JuicyPixels                 ^>=3.3.9
  - &dep-aeson                       aeson                        >=2.2.3    && <2.4
  - &dep-async                       async                       ^>=2.2.6
  - &dep-bytestring                  bytestring                  ^>=0.12.2
  - &dep-containers                  containers                   >=0.7      && <1.0
  - &dep-data-default                data-default                ^>=0.8.0
  - &dep-deepseq                     deepseq                     ^>=1.5.1
  - &dep-derive-storable             derive-storable             ^>=0.3.1
  - &dep-directory                   directory                   ^>=1.3.9
  - &dep-exceptions                  exceptions                  ^>=0.10.9
  - &dep-fast-logger                 fast-logger                 ^>=3.2.6
  - &dep-filelock                    filelock                    ^>=0.1.1
  - &dep-gi-glib                     gi-glib                      >=2.0.30   && <2.1
  - &dep-haskeline                   haskeline                   ^>=0.8.2
  - &dep-microlens-platform          microlens-platform           >=0.4      && <1
  - &dep-microlens                   microlens
  - &dep-monad-logger-aeson          monad-logger-aeson          ^>=0.4.1
  - &dep-mtl                         mtl                         ^>=2.3.1
  - &dep-network                     network                     ^>=3.2.8
  - &dep-optparse-applicative        optparse-applicative         >=0.18.1   && <0.20
  - &dep-optparse-generic            optparse-generic            ^>=1.5
  - &dep-pretty-simple               pretty-simple               ^>=4.1.4
  - &dep-prettyprinter               prettyprinter               ^>=1.7.1
  - &dep-prettyprinter-ansi-terminal prettyprinter-ansi-terminal ^>=1.1.3
  - &dep-process                     process                     ^>=1.6.25
  - &dep-rio                         rio                         ^>=0.1.24
  - &dep-stm                         stm                         ^>=2.5.3
  - &dep-text                        text                        ^>=2.1.2
  - &dep-time                        time                         >=1.14     && <2.0
  - &dep-transformers                transformers                ^>=0.6.1
  - &dep-typed-process               typed-process               ^>=0.2.13
  - &dep-typerep-map                 typerep-map                 ^>=0.7.0
  - &dep-unbounded-delays            unbounded-delays            ^>=0.1.1
  - &dep-unix                        unix                        ^>=2.8.6
  - &dep-unliftio                    unliftio                    ^>=0.2.25
  - &dep-unliftio-core               unliftio-core               ^>=0.2.1
  - &dep-utf8-string                 utf8-string                 ^>=1.0.2
  - &dep-vector                      vector                      ^>=0.13.2
  - &dep-filepath                    filepath

  # Packages from here
  - &dep-hswm-bindings               hswm-bindings
  - &dep-pixman-bindings             pixman-bindings
  - &dep-xkbcommon-bindings          xkbcommon-bindings

  # Other
  - &common-rts
    -threaded
    -rtsopts "-with-rtsopts=-N -maxN4 -qn2 -A8M -K64M -M512M -kc8k -I5 -xr100G"

library:
  source-dirs: src
  #exposed-modules: # discovered by hpack
  other-modules: []
  dependencies:
    - hswm:ipc-api
    - *hswm-prelude
    - *dep-pixman-bindings
    - *dep-xkbcommon-bindings
    - *dep-hswm-bindings
    # external
    - *base-noprelude
    - *dep-JuicyPixels
    - *dep-aeson
    - *dep-bytestring
    - *dep-containers
    - *dep-data-default
    - *dep-fast-logger
    - *dep-filelock
    - *dep-gi-glib
    - *dep-mtl
    - *dep-network
    - *dep-optparse-applicative
    - *dep-optparse-generic
    - *dep-pretty-simple
    - *dep-process
    - *dep-template-haskell
    - *dep-text
    - *dep-time
    - *dep-transformers
    - *dep-typed-process
    - *dep-typerep-map
    - *dep-unbounded-delays
    - *dep-unix
    - *dep-utf8-string
    - *dep-vector
    - *dep-filepath
    - th-abstraction
    - microlens-th
  build-tools:
    - hsc2hs:hsc2hs

internal-libraries:
  prelude:
    visibility: public
    exposed-modules: HSWM.Prelude
    other-modules: []
    source-dirs: hswm-prelude
    dependencies:
      - *base
      - *dep-mtl
      - *dep-stm
      - *dep-text
      - *dep-data-default
      - *dep-async
      - *dep-exceptions
      - *dep-rio
      # - *dep-unliftio-core
      - *dep-unliftio
      - *dep-monad-logger-aeson
      - *dep-microlens-platform
      - *dep-microlens

  ipc-api:
    visibility: public
    exposed-modules: HSWM.IPC
    other-modules: []
    generated-other-modules: PackageInfo_hswm
    source-dirs: ipc-api
    dependencies:
      - *base-noprelude
      - *hswm-prelude
      - *dep-aeson
      - *dep-bytestring
      - *dep-network
      - *dep-text
      - *dep-utf8-string

executables:
  hswm:
    main: Main.hs
    source-dirs: app
    other-modules: []
    dependencies:
      - hswm
      - *base
      - *dep-containers
      - *dep-bytestring
    ghc-options:
      - *common-rts

  hswmctl:
    main: Main.hs
    source-dirs: app-ctl
    other-modules: []
    dependencies:
      - hswm
      - hswm:ipc-api
      - *hswm-prelude
      - *base-noprelude
      - *dep-bytestring
      - *dep-text
      - *dep-time
      - *dep-aeson
      - *dep-optparse-applicative
      - *dep-optparse-generic
      - *dep-haskeline
      - *dep-prettyprinter
      - *dep-prettyprinter-ansi-terminal
    ghc-options:
      - *common-rts
