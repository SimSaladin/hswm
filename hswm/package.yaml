---
verbatim:
  - cabal-version: 3.12
name: hswm
version: 0.1.0.0
synopsis: Wayland window manager for River
description: Wayland window manager for River
license: MIT
license-file: LICENSE
author: Samuli Thomasson
maintainer: samuli.thomasson@pm.me
# copyright:
build-type: Simple
tested-with:
  - GHC == 9.14.1
  - GHC == 9.12.4
  - GHC == 9.12.2

flags:
  llvm:
    description: Link with LLVM
    default: true
    manual: true
  pie:
    description: Enable PIE output
    default: true
    manual: true
  optimize:
    description: Enable further compiler optimizations
    default: true
    manual: true

language: GHC2024
default-extensions:
  - DeriveAnyClass
  - DerivingVia
  - DuplicateRecordFields
  - FunctionalDependencies
  - OverloadedLabels
  - OverloadedRecordDot
  - OverloadedStrings
  - PackageImports
  - QuantifiedConstraints
  - RecordWildCards
  - TypeFamilies

# https://discourse.haskell.org/t/what-are-you-supposed-to-do-about-wambiguous-fields/9545/36?page=2
ghc-options:
  -Wall
  -Wno-partial-type-signatures
  -Wno-ambiguous-fields
  -Wno-typed-holes

when:
  # llvm flag handling
  - condition: flag(llvm) && impl(ghc >= 9.14.1)
    ghc-options: -fllvm
  # optimize flag
  - condition: flag(optimize)
    ghc-options: -O2 -funbox-strict-fields

# Dependencies
__:
  - &base
    name: base
    version: '>=4.21 && <5'
  - &base-noprelude
    <<: *base
    mixin: hiding (Prelude)
  - &hswm-prelude
    name: hswm:prelude
    mixin: (HSWM.Prelude as Prelude)
  - &JuicyPixels                 JuicyPixels                 ^>=3.3.9
  - &aeson                       aeson                       >=2.2.3 && <2.4
  - &aeson-pretty                aeson-pretty
  - &async                       async                       ^>=2.2.6
  - &bytestring                  bytestring                  ^>=0.12.2
  - &containers                  containers                  >=0.7 && <1.0
  - &data-default                data-default                ^>=0.8.0
  - &exceptions                  exceptions                  ^>=0.10.9
  - &fast-logger                 fast-logger                 ^>=3.2.6
  - &filelock                    filelock                    ^>=0.1.1
  - &filepath                    filepath
  - &gi-glib                     gi-glib       >=2.0.30 && <2.1
  - &haskeline                   haskeline                   ^>=0.8.4
  - &microlens                   microlens
  - &microlens-platform          microlens-platform          >=0.4 && <1
  - &microlens-th                microlens-th
  - &monad-logger                monad-logger
  - &monad-logger-aeson          monad-logger-aeson          ^>=0.4.1
  - &mtl                         mtl                         ^>=2.3.1
  - &network                     network                     ^>=3.2.8
  - &optparse-applicative        optparse-applicative >=0.18.1 && <0.20
  - &optparse-generic            optparse-generic            ^>=1.5
  - &pretty-simple               pretty-simple               ^>=4.1.4
  - &prettyprinter               prettyprinter               ^>=1.7.1
  - &prettyprinter-ansi-terminal prettyprinter-ansi-terminal ^>=1.1.3
  - &prettyprinter-combinators   prettyprinter-combinators
  - &process                     process                     ^>=1.6.25
  - &random                      random
  - &rio                         rio                         ^>=0.1.24
  - &safe-exceptions             safe-exceptions
  - &stm                         stm                         ^>=2.5.3
  - &syb                         syb
  - &template-haskell            template-haskell            >=2.20 && <3
  - &text                        text                        ^>=2.1.2
  - &text-short                  text-short
  - &th-abstraction              th-abstraction
  - &time                        time                        >=1.14 && <2.0
  - &transformers                transformers                ^>=0.6.1
  - &typed-process               typed-process               ^>=0.2.13
  - &typerep-map                 typerep-map                 ^>=0.7.0
  - &unbounded-delays            unbounded-delays            ^>=0.1.1
  - &unix                        unix                        ^>=2.8.6
  - &unliftio                    unliftio                    ^>=0.2.25
  - &unliftio-core               unliftio-core               ^>=0.2.1
  - &utf8-string                 utf8-string                 ^>=1.0.2
  - &vector                      vector                      ^>=0.13.2
  - &directory                   directory
  - &MissingH                    MissingH

library:
  source-dirs: src
  other-modules:
    - PackageInfo_hswm
  dependencies:
    - hswm:ipc-api
    - pixman-bindings
    - xkbcommon-bindings
    - hswm-bindings
    - *hswm-prelude
    - *base-noprelude
    - *JuicyPixels
    - *aeson
    - *bytestring
    - *containers
    - *data-default
    - *fast-logger
    - *monad-logger
    - *filelock
    - *gi-glib
    - *mtl
    - *syb
    - *network
    - *optparse-applicative
    - *optparse-generic
    - *pretty-simple
    - *prettyprinter
    - *prettyprinter-combinators
    - *prettyprinter-ansi-terminal
    - *process
    - *template-haskell
    - *text
    - *time
    - *transformers
    - *typed-process
    - *typerep-map
    - *unbounded-delays
    - *unix
    - *utf8-string
    - *vector
    - *filepath
    - *text-short
    - *th-abstraction
    - *microlens-th
    - *directory
    - *MissingH
  when:
    - condition: flag(pie)
      ghc-options:
        - -fPIC
        - -pie
internal-libraries:
  prelude:
    visibility: public
    exposed-modules: HSWM.Prelude
    other-modules: []
    source-dirs: hswm-prelude
    dependencies:
      - *base
      - *mtl
      - *stm
      - *text
      - *data-default
      - *async
      - *exceptions
      - *rio
      - *unliftio-core
      - *unliftio
      - *monad-logger-aeson
      - *microlens-platform
      - *microlens
      - *bytestring
      - *text-short
      - *safe-exceptions
      - *unix
  ipc-api:
    visibility: public
    exposed-modules: HSWM.IPC
    other-modules: []
    generated-other-modules: PackageInfo_hswm
    source-dirs: ipc-api
    dependencies:
      - *base-noprelude
      - *hswm-prelude
      - *aeson
      - *bytestring
      - *network
      - *text
      - *utf8-string
      - *random
      - *optparse-generic

executables:
  hswm:
    main: Main.hs
    source-dirs: app
    other-modules: []
    dependencies:
      - hswm
      - *base
      - *bytestring
      - *containers
      - *text
    ghc-options:
      - -threaded
      - -rtsopts
      - >
        "-with-rtsopts=-N -maxN8 -I0 -A96M -M4G -K12M -xr128G"

  hswmctl:
    main: Main.hs
    source-dirs: app-ctl
    other-modules: []
    dependencies:
      - hswm
      - hswm:ipc-api
      - *hswm-prelude
      - *base-noprelude
      - *aeson
      - *aeson-pretty
      - *bytestring
      - *haskeline
      - *mtl
      - *optparse-applicative
      - *optparse-generic
      - *prettyprinter
      - *prettyprinter-ansi-terminal
      - *text
      - *text-short
      - *time
    ghc-options:
      - -threaded
      - -rtsopts
      - >
        "-with-rtsopts=-N -maxN8 -I0 -A96M -M4G -K12M -xr128G"
